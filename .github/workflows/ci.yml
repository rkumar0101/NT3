name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node first
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install pnpm globally (so commands are available)
      - name: Install pnpm
        run: npm install -g pnpm@9

      # Confirm pnpm is available
      - name: Check pnpm version
        run: pnpm --version

      # Install dependencies
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint || echo "Lint warnings ignored"

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build
