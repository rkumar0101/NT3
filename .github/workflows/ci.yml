name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    # Your Next.js app lives in ./web
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (with Corepack)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 👇 This is the key: enable pnpm via Corepack (no global npm install)
      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate
          pnpm -v

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint || echo "Lint warnings ignored"

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Build
        run: pnpm build
